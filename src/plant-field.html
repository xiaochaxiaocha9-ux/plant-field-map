  <script>
  (()=>{
    const root=document.getElementById('plant-field-3d');
    const $=s=>root.querySelector(s),stage=$('#pf-stage'),canvas=$('#pf-canvas');
    const escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const clean=s=>String(s??'').normalize('NFKC').trim();
    let tasks=[];
    /*__PUBLISHED_TASKS__*/
    // Row numbers follow the user: first = south/lowest, third = north/highest.

    const areas=['第一片区','第二片区'],centers=[{x:0,z:0},{x:0,z:-25}],columns=12,spacing=1.62,rowSpacing=1.45,rowElevations=[0,.5,1],frameDepth=rowSpacing*1.5-.15,layout=new Map(),pots=[];
    const frameRegions=[[{left:-10,right:-3.8},{left:2,right:10}],[{left:-2,right:10}]];

    const actualRows=[
      {ids:['59','56','49','224','36','1166','1131'],xs:[2.55,3.45,4.35,5.25,7.2,8.35,9.5],groups:[0,0,0,0,1,1,1]},
      {ids:['157','542','792','46','298','227','922','78'],xs:[2.55,3.45,4.35,5.25,6.8,7.7,8.6,9.5],groups:[0,0,0,0,1,1,1,1]},
      {ids:['515','694','82','47','320','287','207','79'],xs:[2.55,3.55,4.55,5.55,6.55,7.55,8.55,9.55],groups:[0,0,0,0,0,0,0,0]}
    ];
    const pendingSecondRow=false;
    actualRows.forEach((data,row)=>data.ids.forEach((id,col)=>{const p={id,zone:0,area:areas[0],section:'右侧有架区',slot:row*12+col,row,col,group:data.groups[col],x:data.xs[col],y:rowElevations[row],z:(1-row)*rowSpacing,confirmed:!!id};pots.push(p);if(id){if(layout.has(id))throw Error('重复盆位编号：'+id);layout.set(id,p);}}));
    const colors={wire:[.64,.83,.94,1],grid:[.25,.31,.37,.46],frame:[.47,.57,.64,.72],cross:[.95,.57,.59,1],donor:[.90,.76,.51,1],auto:[.56,.82,.65,1],open:[.85,.90,.94,1],measure:[.53,.75,.96,1],hand:[.77,.67,.92,1],other:[.45,.57,.66,1]};
    const settings={frameHeight:3.35,duration:1900,brightness:1,greenhouse:true};
    let phase='morning',queryIds=[],selected='56',activePair='',currentZone=0,pending=null,taskLabel='盆位核对 · 未载入当日任务';
    if(typeof publishedTasks!=='undefined'){tasks=publishedTasks.tasks;taskLabel=publishedTasks.label+(publishedTasks.date?' · '+publishedTasks.date:'');}
    const cameraLimits={pan:14,minPitch:.32,maxPitch:1.25},axisHeight=1.2,axisOffset=-1.2;
    let camera={cx:0,cz:0,yaw:0,pitch:.69,distance:31},flight=null,frameRequested=false,mvp=null,cssWidth=736,cssHeight=560,sceneBuffers=null,lastSavedSignature='';
    const motion=matchMedia('(prefers-reduced-motion: reduce)');
    function kind(t){const s=t.morning;if(/接\s*\d+\s*花粉/.test(s))return'cross';if(/给\s*\d+\s*供粉/.test(s))return'donor';if(s.includes('自主自交'))return'auto';if(s.includes('人工自交'))return'hand';if(s.includes('自然开放'))return'open';if(/摘取|测量|采样/.test(s))return'measure';return'other';}
    function pairsOf(ts){const pairs=new Map();for(const t of ts){let m=t.morning.match(/接\s*(\d+)\s*花粉/);if(m){const key=m[1]+'>'+t.id;pairs.set(key,{key,donor:m[1],mother:t.id});}m=t.morning.match(/给\s*(\d+)\s*供粉/);if(m){const key=t.id+'>'+m[1];if(!pairs.has(key))pairs.set(key,{key,donor:t.id,mother:m[1]});}}return [...pairs.values()];}
    const records=id=>tasks.filter(t=>t.id===id);
    const getPair=()=>pairsOf(tasks).find(p=>p.key===activePair);
    const rgba=(c,a)=>[c[0],c[1],c[2],a],mix=(a,b,t)=>a+(b-a)*t;
    const ease=t=>t*t*(3-2*t),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
    const distanceForWidth=(zone=currentZone)=>Math.max(zone===0?13.5:29,(zone===0?5.9:15)/(Math.tan(38*Math.PI/360)*(cssWidth/cssHeight)));

        if(el.classList.contains('pf-label')){g.fillStyle=s.getPropertyValue('--task-color')||'#a5d5ef';g.beginPath();g.arc(x+5,y+r.height/2,2,0,Math.PI*2);g.fill();}
      }
      g.textAlign='left';g.textBaseline='alphabetic';g.font='11px system-ui, "Microsoft YaHei", sans-serif';g.fillStyle='#97a5b2';
      const status=currentZone===0?'第一排最低 · 第三排最高 · 间距示意':'盆位待录入';g.fillText(status,16,head+cssHeight+23);
      if(tasks.length){const marks=[['#f19b9d','异交母本'],['#e4c189','供粉'],['#96d1ae','自主'],['#dce5eb','开放'],['#96c5ee','采样'],['#c3afe8','人工自交']];let x=16,y=head+cssHeight+45;for(const [c,label]of marks){const w=g.measureText(label).width+23;if(x+w>cssWidth-12){x=16;y+=18;}g.fillStyle=c;g.fillRect(x,y-7,6,6);g.fillStyle='#97a5b2';g.fillText(label,x+10,y);x+=w;}}
      const png=output.toDataURL('image/png');$('#pf-export-image').src=png;
      const download=$('#pf-export-download');if(download.dataset.blob)URL.revokeObjectURL(download.dataset.blob);
      const bytes=Uint8Array.from(atob(png.split(',')[1]),c=>c.charCodeAt(0));const blob=URL.createObjectURL(new Blob([bytes],{type:'image/png'}));
      download.href=blob;download.dataset.blob=blob;download.download='同质园_'+areas[currentZone]+'.png';$('#pf-export-dialog').showModal();
    });
    $('#pf-search').value=queryIds.join(' ');root.dataset.flight='idle';resize();refresh();
    if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:()=>{buildScene();requestRender();save();}});tweak.addToggle(settings,'greenhouse',{label:'显示玻璃大棚'});tweak.addSlider(settings,'frameHeight',{label:'架子高度（示意）',min:2,max:4.4,step:.1});tweak.addSlider(settings,'duration',{label:'切区镜头时长',min:900,max:3000,step:100,unit:'ms'});tweak.addSlider(settings,'brightness',{label:'线框亮度',min:.7,max:1.3,step:.1});}
  })();
